<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Student Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root{--bg:#f2dfc9;--card:#fff;--accent:#542c15;--input-bg:#e8f0fe}
    *{box-sizing:border-box;font-family:Arial,sans-serif}

    body{
      margin:0;min-height:100vh;display:flex;align-items:center;
      justify-content:center;background:var(--bg);padding:24px;
    }
    .container{
      width:700px;max-width:95%;background:var(--card);
      padding:24px;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.12);
    }
    h2{text-align:center;color:var(--accent);margin:0 0 18px}

    label{
      font-weight:700;color:var(--accent);
      display:block;margin-top:10px;font-size:14px;
    }
    input,select{
      width:100%;padding:8px 10px;margin-top:4px;
      border-radius:8px;border:1px solid #bbb;
      background:var(--input-bg);font-size:14px;
    }

    .row{display:flex;gap:14px;flex-wrap:wrap}
    .col-3{flex:1 1 30%}

    .btn{
      width:100%;padding:10px 12px;margin-top:18px;
      background:var(--accent);color:#fff;border:none;
      border-radius:10px;font-size:15px;cursor:pointer;
    }

    .status{
      margin-top:12px;padding:8px 10px;border-radius:8px;
      display:none;font-weight:600;font-size:14px;
    }
    .status.ok{display:block;background:#e6f8e9;color:#1a7a2e;border:1px solid #c7f0cf}
    .status.err{display:block;background:#ffecec;color:#9b1d1d;border:1px solid #f0c7c7}
  </style>
</head>
<body>
<div class="container">
  <h2>Student Registration</h2>

  <form id="studentForm" novalidate>
    <div class="row">
      <div class="col-3">
        <label for="roll_no">Roll No</label>
        <input id="roll_no" type="text" placeholder="22A91A0567">
      </div>
      <div class="col-3">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Student Name">
      </div>
      <div class="col-3">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="student@gmail.com">
      </div>
    </div>

    <div class="row">
      <div class="col-3">
        <label for="phone">Phone</label>
        <input id="phone" type="text" placeholder="9876543210">
      </div>
      <div class="col-3">
        <label for="branch">Branch</label>
        <input id="branch" type="text" placeholder="CSE / ECE / EEE">
      </div>
      <div class="col-3">
        <label for="year">Year</label>
        <select id="year">
          <option value="">Select Year</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="col-3">
        <label for="section">Section</label>
        <select id="section">
          <option value="">Select Section</option>
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
        </select>
      </div>
    </div>

    <button type="submit" id="saveBtn" class="btn">Add Student</button>
    <div id="status" class="status"></div>
  </form>
</div>

<script>
const ADD_URL = "http://localhost:8080/addStudent";
const form     = document.getElementById("studentForm");
const statusEl = document.getElementById("status");
const saveBtn  = document.getElementById("saveBtn");

const getVal = id => document.getElementById(id).value.trim();
const showStatus = (msg, ok=true) => {
  statusEl.textContent = msg;
  statusEl.className = ok ? "status ok" : "status err";
};

form.addEventListener("submit", async e => {
  e.preventDefault();
  statusEl.className = "status";
  statusEl.textContent = "";

  const roll    = getVal("roll_no");
  const name    = getVal("name");
  const email   = getVal("email");
  const year    = getVal("year");
  const section = getVal("section");

  if (!roll)    return showStatus("Roll number is required.", false);
  if (!name)    return showStatus("Name is required.", false);
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
    return showStatus("Invalid email format.", false);
  if (!year)    return showStatus("Year is required.", false);
  if (!section) return showStatus("Section is required.", false);

  const p = new URLSearchParams({
    roll_no: roll,
    name,
    email,
    phone: getVal("phone"),
    branch: getVal("branch"),
    year,
    section
  });

  saveBtn.disabled = true;
  saveBtn.textContent = "Please wait...";

  try {
    const resp = await fetch(ADD_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "Accept": "application/json"
      },
      body: p.toString()
    });

    const text = await resp.text();
    let data = null;
    try { data = JSON.parse(text); } catch {}

    if (resp.status === 409)
      return showStatus("❌ Roll number already exists.", false);

    if (resp.ok && data && data.status === "ok") {
      showStatus("✅ Student Added! ID = " + data.id, true);
      form.reset();
      return;
    }
    showStatus("⚠ Unexpected response from server: " + text, false);
  } catch (err) {
    showStatus("❌ Server error: " + err.message, false);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Add Student";
  }
});
</script>
</body>
</html>
